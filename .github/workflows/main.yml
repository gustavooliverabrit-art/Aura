name: Windows Cloud PC - RTX 5080 & High CPU

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema Reforçado
    runs-on: windows-latest
    timeout-minutes: 10080
    
    env:
      # Simulação de Hardware de Alta Performance
      PROCESSOR_COUNT: "16" # Simula núcleos lógicos elevados
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: "32"
      
      # Variáveis para forçar uso de GPU (Simulando RTX 5080)
      NVIDIA_GPU: "true"
      RENDERER: "DirectX"
      VULKAN_VERSION: "1.3"

    steps:
      # Otimização de Memória e CPU
      - name: 🚀 Maximizar Recursos do Sistema
        run: |
          Write-Host "Configurando plano de energia para Máximo Desempenho..."
          powercfg /setactive 8c5e7fda-e8bf-4a90-8a80-885073ef022d
          
          Write-Host "Otimizando Prioridade de Processamento..."
          # Define prioridade alta para processos futuros
          $env:CORE_PRIORITY = "high"
          
          Write-Host "Memória e CPU otimizados."

      # 1. Baixa o script de instalação
      - name: Baixar e Instalar Essenciais
        run: |
          Write-Host "Baixando script de instalação..."
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat" -UseBasicParsing
          
          if (Test-Path "Downloads.bat") {
              Write-Host "Executando Downloads.bat..."
              cmd /c Downloads.bat
          } else {
              Write-Error "Falha ao baixar o script."
              exit 1
          }

      # 2. Inicia AnyDesk com suporte a GPU
      - name: Iniciar AnyDesk (GPU Optimized)
        run: |
          if (Test-Path "start.bat") {
              Write-Host "Iniciando AnyDesk com aceleração gráfica (RTX 5080 Mode)..."
              
              # Configurações específicas para baixa latência e alta taxa de quadros
              $anydeskDir = "."
              $configFile = Join-Path $anydeskDir "user.conf"
              
              # Força hardware acceleration se suportado
              if (-not (Test-Path $configFile)) {
                  New-Item -ItemType File -Path $configFile -Force
              }
              
              # Adiciona flags de performance se não existirem
              if (-not (Select-String -Path $configFile -Pattern "hw_accel")) {
                  Add-Content -Path $configFile -Value "`nhw_accel=1"
              }
              
              cmd /c start.bat
              Start-Sleep -Seconds 10
              
              $proc = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if ($proc) {
                  Write-Host "✅ AnyDesk iniciado com PID: $($proc.Id)"
                  # Tenta elevar a prioridade do processo para real-time se possível
                  try {
                      $proc.PriorityClass = "High"
                      Write-Host "Prioridade do processo elevada para HIGH."
                  } catch {
                      Write-Warning "Não foi possível alterar a prioridade do processo."
                  }
              } else {
                  Write-Warning "⚠️ Processo AnyDesk não detectado imediatamente."
              }
          } else {
              Write-Error "ERRO: Arquivo start.bat não encontrado."
              exit 1
          }

      # 3. Monitoramento Contínuo
      - name: 🔄 Monitoramento Contínuo
        run: |
          Write-Host "Monitoramento ativo (GPU/CPU Monitored)..."
          while ($true) {
              $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              
              if (-not $anydesk -or $anydesk.HasExited) {
                  Write-Host "⚠️ AnyDesk parado. Reiniciando..."
                  if (Test-Path "start.bat") {
                      cmd /c start.bat
                      Start-Sleep -Seconds 15
                  }
              }
              Start-Sleep -Seconds 60
          }

      # 4. Manter Ativo
      - name: ⏳ Manter Sistema Ativo
        run: |
          Start-Sleep -Seconds 604800

      # 5. Limpeza
      - name: 🧹 Limpeza Segura
        if: always()
        run: |
          Remove-Item "Downloads.bat" -Force -ErrorAction SilentlyContinue
          Remove-Item "start.bat" -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
