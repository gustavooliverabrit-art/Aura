name: Windows Cloud PC - AnyDesk (High Spec Config)
on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building High Spec...
    runs-on: windows-latest
    timeout-minutes: 10080
    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      RAM_TARGET_GB: 48
      VRAM_TARGET_GB: 128

    steps:
      - name: Detect Hardware Specs (CPU/GPU/RAM)
        run: |
          Write-Host "=== DETECTANDO HARDWARE ==="
          
          # CPU Cores
          $cpuCores = (Get-CimInstance Win32_Processor).NumberOfCores
          Write-Host "CPU Cores: $cpuCores"
          
          # Total RAM (in GB)
          $totalRAM = [math]::Round((Get-CimInstance Win32_OperatingSystem).TotalVisibleMemorySize / 1MB, 2)
          Write-Host "Total RAM: ${totalRAM} GB"
          
          # GPU Info
          $gpu = Get-CimInstance Win32_VideoController
          Write-Host "GPU Model: $($gpu.Name)"
          $vram = [math]::Round($gpu.AdapterRAM / 1GB, 2)
          Write-Host "VRAM: ${vram} GB"
          
          # Verifica se atende aos requisitos mínimos solicitados
          if ($cpuCores -ge 8 -and $totalRAM -ge 48 -and $vram -ge 12) {
              Write-Host "STATUS: Hardware alto detectado!"
          } else {
              Write-Host "AVISO: Hardware padrão do GitHub. Baixando drivers genéricos..."
          }

      - name: Downloading & Installing Essentials
        run: |
          # Baixa o script de instalação original
          Invoke-WebRequest -Uri "https://www.dropbox.com/scl/fi/7eiczvgil84czu55dxep3/Downloads.bat?rlkey=wzdc1wxjsph2b7r0atplmdz3p&dl=1" -OutFile "Downloads.bat"
          
          # Executa o script de instalação
          cmd /c Downloads.bat
          
          # Limpa o arquivo baixado após uso
          Remove-Item Downloads.bat -Force

      - name: Log In To AnyDesk
        run: |
          if (Test-Path "start.bat") {
              Write-Host "Iniciando AnyDesk..."
              cmd /c start.bat
          } else {
              Write-Host "Arquivo start.bat não encontrado. Verifique a configuração."
              exit 1
          }

      - name: Monitor and Restart AnyDesk if Needed
        run: |
          while ($true) {
              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
              if (-not $process) {
                  Write-Host "AnyDesk não está rodando, reiniciando..."
                  if (Test-Path "start.bat") {
                      cmd /c start.bat
                  }
              }
              # Aguarda 5 minutos antes de verificar novamente
              Start-Sleep -Seconds 300
          }

      - name: Time Counter (Long Running Task)
        run: |
          # Mantém o runner ativo por 7 dias completos
          Write-Host "Monitoramento ativo por 7 dias..."
          Start-Sleep -Seconds 604800

      - name: Clean Up Temporary Files
        if: always()
        run: |
          Write-Host "Limpeza completa."
          # Remove arquivos temporários se ainda existirem
          if (Test-Path "Downloads.bat") {
              Remove-Item Downloads.bat -Force
          }
